name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev,ci]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q
